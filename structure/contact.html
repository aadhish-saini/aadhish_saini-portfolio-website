<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Contact</title>
    <link rel="stylesheet" href="css/contact_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="images/website-logo.png" alt="logo not found!">
            </div>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" id="contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="alltext">
                <div class="text">
                    <h2>LET's CONNECT</h2>
                    <hr>
                    <h1>Have a project in mind?</h1>
                    <h3>I'm always open for discussing new opportunities, collaborations, or just having a chat.</h3>
                    <div class="maingrid">
                        <div class="grid">
                            <div class="item">
                                <div class="items">
                                    <i class="fa-regular fa-envelope"></i>
                                    <h4>aadhishsaini14@gmail.com</h4>
                                </div>
                            </div>
                            <div class="item">
                                <div class="items">
                                    <i class="fa-solid fa-phone-flip"></i>
                                    <h4>+91 94855-50490</h4>
                                </div>
                            </div>
                            <div class="item">
                                <div class="items">
                                    <i class="fa-solid fa-location-dot"></i>
                                    <h4>India</h4>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="inputs">
                <div class="inputcontainer">
                    <h1>Connect with me !</h1>
                    <div class="name">
                        <input type="text" placeholder="Your Name" required>
                        <input type="email" placeholder="Your Email" id="" required>
                    </div>
                    <select required id="subject">
                        <option value="" selected>Select Subject</option>
                        <option value="project-inquiry">Project Inquiry</option>
                        <option value="freelance-work">Freelance Work</option>
                        <option value="job-opportunity">Job Opportunity</option>
                        <option value="internship">Internship Opportunity</option>
                        <option value="collaboration">Collaboration</option>
                        <option value="website-development">Website Development</option>
                        <option value="python-automation">Python Automation</option>
                        <option value="technical-support">Technical Support</option>
                        <option value="feedback">Feedback</option>
                        <option value="general-question">General Question</option>
                        <option value="other">Other</option>
                    </select>
                    <textarea placeholder="Message" id=""></textarea>
                    <button>Send <i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>


    </main>
    <footer>
        <p>Copyrights Reverved &copy; | Aadhish Saini</p>
    </footer>
</body>

</html>
